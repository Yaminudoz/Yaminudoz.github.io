# Hexo configuration for 拾阶
title: 拾阶
subtitle: 学习资源与技术笔记
description: 整理学习资源、编程笔记与技术思考。
keywords:
  - 学习
  - 编程
  - 技术笔记
author: Yaminudoz
language: zh-CN
timezone: Asia/Shanghai

url: https://yaminudoz.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

theme: next

source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date

archive_generator:
  per_page: 20
  yearly: true
  monthly: true
category_generator:
tag_generator:

marked:
  prependRoot: true
  postAsset: false

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

theme_config: null
